<!DOCTYPE html>
<html>
  <head>
    <title>Example</title>
    <meta charset="utf-8" />
    <script src="/client.js" defer></script>

    <link rel="stylesheet"
    href="/style.css">

  <body>
    <header>
      <h1>
        Book a Reservation
      </h1>
    </header>
    <main>

      <img src="Menu.png" alt="Menu.png">
      
      <h3>Add a new booking:</h3>
      <form>
        <label>Name:</label>
        <input id="name" type="text" placeholder="Lionel" /> <br /><br />
        <label>Day:</label>
        <input id="day" type="number" placeholder="03" /> <br /><br />
         <label>Month:</label>
        <input id="month" type="text" placeholder="March" /> <br /><br />
         <label>Year:</label>
        <input id="year" type="number" placeholder="2026" /> <br /><br />

        <!-- REALLY IMPORTANT to get this to work!! -->

        <button id="submit-btn" type="submit">Submit</button>

        <!-- found on w3school -->
        <!--<button id="myBtn" type="button" value="Submit">Submit</button> -->
      </form>
      <!-- TUTORIAL D -->
      <p>Users:</p>
      <section>
        <ul id="users"></ul>
      </section>
    </main>
  </body>
</html>
